<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Offline — V3RCHAT</title>
  <link rel="icon" type="image/png" href="/icons/icon-192x192.png">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: calc(var(--safe-top) + 1.5rem) calc(var(--safe-right) + 1.5rem) calc(var(--safe-bottom) + 1.5rem) calc(var(--safe-left) + 1.5rem);
      text-align: center;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
    }
    .offline-card {
      max-width: 420px;
      width: 100%;
      background: rgba(18, 18, 20, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 1.5rem;
      padding: 2.5rem 1.75rem;
      backdrop-filter: blur(24px) saturate(1.8);
      -webkit-backdrop-filter: blur(24px) saturate(1.8);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
      animation: fadeIn 0.4s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .logo-wrapper {
      position: relative;
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, rgba(0,0,0,0) 70%);
    }
    .logo-wrapper img {
      width: 64px;
      height: 64px;
      object-fit: contain;
      filter: drop-shadow(0 0 16px rgba(255, 255, 255, 0.2));
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #ef4444;
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    h1 {
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #ffffff;
    }
    p {
      font-size: 0.9rem;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.65);
    }
    .btn-retry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 0.5rem;
      padding: 0.75rem 1.75rem;
      border-radius: 9999px;
      background: #ffffff;
      color: #000000;
      font-size: 0.875rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(255, 255, 255, 0.2);
    }
    .btn-retry:hover {
      background: #e4e4e7;
      transform: translateY(-1px);
    }
    .btn-retry:active {
      transform: scale(0.97);
    }
    .footnote {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.4);
      margin-top: 0.25rem;
    }
  </style>
</head>
<body>
  <main class="offline-card">
    <div class="logo-wrapper">
      <img src="/icons/icon-192x192.png" alt="V3RCHAT Logo" width="64" height="64">
    </div>
    <div class="status-badge">
      <span class="status-dot"></span>
      Network Signal Lost
    </div>
    <h1>Offline Mode</h1>
    <p>
      V3RCHAT cannot reach the network right now. Your sovereign identity and local cache remain secure. We'll automatically reconnect once signal is restored.
    </p>
    <button type="button" class="btn-retry" onclick="attemptReconnect()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
      </svg>
      Retry Connection
    </button>
    <div class="footnote">Checking link state automatically...</div>
  </main>

  <script>
    function attemptReconnect() {
      if (navigator.onLine) {
        window.location.reload();
      } else {
        const btn = document.querySelector('.btn-retry');
        const originalText = btn.innerHTML;
        btn.innerHTML = 'Connecting...';
        btn.style.opacity = '0.7';
        fetch('/manifest.json', { cache: 'no-store', method: 'HEAD' })
          .then(() => {
            window.location.reload();
          })
          .catch(() => {
            setTimeout(() => {
              btn.innerHTML = originalText;
              btn.style.opacity = '1';
            }, 800);
          });
      }
    }

    window.addEventListener('online', () => {
      attemptReconnect();
    });
  </script>
</body>
</html>
